version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://techtrek:secret@db:5432/techtrek
      SECRET_KEY: change-me-to-a-strong-secret
      OLLAMA_BASE_URL: http://ollama:11434
      APP_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:80
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: techtrek
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: techtrek
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data: {}
