name: Build, Test and Push Docker Images

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        service:
          - backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache pip dependencies
        if: matrix.service == 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Test Python
        if: matrix.service == 'backend'
        run: |
            pip install -r ${{ matrix.service }}/requirements.txt
            pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t helion444/${{ matrix.service }}:$VERSION \
            ./${{ matrix.service }}

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker push helion444/${{ matrix.service }}:$VERSION

      - name: Update Helm image tag
        if: matrix.service == 'backend'
        run: |
          VERSION=v${{ github.run_number }}
          sed -i "s|^image:.*|image: \"helion444/backend:$VERSION\"|" helm/backend/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/backend/values.yaml
          git commit -m "ci: update backend image to $VERSION"
          git push