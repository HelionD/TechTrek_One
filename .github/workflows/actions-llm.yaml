name: Build and Push LLM Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "llm/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('llm/server.py').read()); print('OK')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker buildx build \
            --load \
            -t helion444/llm:$VERSION \
            ./llm

      - name: Login Docker Hub
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          docker push helion444/llm:$VERSION

      - name: Update Helm tag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git reset --hard origin/master
          sed -i "s|tag:.*|tag: $VERSION|" helm/llm/values.yaml
          git add helm/llm/values.yaml
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "ci: update llm image to $VERSION [skip ci]"
          git push