name: Build and Push DB Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "db/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helm-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker buildx build --load -t helion444/db:$VERSION ./db

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          docker push helion444/db:$VERSION

      - name: Update Helm tag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git reset --hard origin/master
          sed -i "s|tag:.*|tag: $VERSION|" helm/db/values.yaml
          git add helm/db/values.yaml
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "ci: update db image to $VERSION [skip ci]"
          git push