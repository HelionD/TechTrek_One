name: Build and Push LLM Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "llm/**"
  pull_request:
    branches: [ "master" ]
    paths:
      - "llm/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint server.py (DO NOT FAIL CI)
        run: |
          pip install pyflakes
          python -m pyflakes llm/server.py || true

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('llm/server.py').read()); print('OK')"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker buildx build \
            --load \
            -t helion444/llm:$VERSION \
            ./llm

      - name: Login Docker Hub
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          docker push helion444/llm:$VERSION

      - name: Update Helm tag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          sed -i "s|tag:.*|tag: $VERSION|" helm/llm/values.yaml

      - name: Commit Helm update
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/llm/values.yaml
          git commit -m "update image $VERSION" || echo "no changes"
          git push