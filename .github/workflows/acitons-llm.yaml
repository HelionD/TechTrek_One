name: Build and Push LLM Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "llm/**"
  pull_request:
    branches: [ "master" ]
    paths:
      - "llm/**"

concurrency:
  group: helm-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint server.py
        run: |
          pip install pyflakes
          python -m pyflakes llm/server.py

      - name: Validate server.py syntax
        run: python -c "import ast; ast.parse(open('llm/server.py').read()); print('Syntax OK')"

      - name: Unit-test HTTP handlers (no Ollama needed)
        run: |
          pip install pytest
          cat > /tmp/test_llm_server.py << 'EOF'
          import sys, importlib, unittest
          from unittest.mock import patch, MagicMock
          from io import BytesIO
          import json

          sys.path.insert(0, "llm")

          # Patch subprocess and time so importing server.py doesn't start Ollama
          with patch("subprocess.Popen"), patch("subprocess.run"), patch("time.sleep"):
              import server as s

          class FakeRequest:
              def makefile(self, *a, **kw):
                  return BytesIO(b"")

          def make_handler(method, path, body=b""):
              headers = {
                  "Content-Length": str(len(body)),
                  "Content-Type": "application/json",
              }
              class FakeHeaders(dict):
                  def get(self, k, d=None):
                      return headers.get(k, d)
              req = FakeRequest()
              from io import BytesIO
              import http.server
              handler = s.LLMProxyHandler.__new__(s.LLMProxyHandler)
              handler.path = path
              handler.headers = FakeHeaders(headers)
              handler.rfile = BytesIO(body)
              output = BytesIO()
              handler.wfile = output
              handler.request = req
              handler.client_address = ("127.0.0.1", 9999)
              handler.server = MagicMock()
              responses = []
              handler.send_response = lambda code: responses.append(code)
              handler.send_header = lambda k, v: None
              handler.end_headers = lambda: None
              handler.send_error = lambda code, msg=None: responses.append(("error", code))
              return handler, output, responses

          class TestRouting(unittest.TestCase):
              def test_unknown_post_returns_404(self):
                  h, out, resp = make_handler("POST", "/unknown")
                  h.do_POST()
                  self.assertIn(("error", 404), resp)

              def test_unknown_get_returns_404(self):
                  h, out, resp = make_handler("GET", "/unknown")
                  h.do_GET()
                  self.assertIn(("error", 404), resp)

              def test_invalid_json_returns_400(self):
                  h, out, resp = make_handler("POST", "/api/generate", b"not-json")
                  h.do_POST()
                  self.assertIn(("error", 400), resp)

              def test_api_tags_calls_ollama_list(self):
                  mock_result = MagicMock()
                  mock_result.stdout = b"qwen2.5:3b latest abc123 2.1 GB"
                  with patch("subprocess.run", return_value=mock_result):
                      h, out, resp = make_handler("GET", "/api/tags")
                      h.do_GET()
                  self.assertIn(200, resp)

          if __name__ == "__main__":
              unittest.main(verbosity=2)
          EOF
          pytest /tmp/test_llm_server.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=v${{ github.run_number }}
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t helion444/llm:$VERSION \
            ./llm

      - name: Smoke-test LLM image starts
        run: |
          # Start container but mock Ollama so we only test that server.py boots
          docker run -d --name test-llm \
            -p 11434:11434 \
            --entrypoint python \
            helion444/llm:v${{ github.run_number }} \
            -c "
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  body = json.dumps({'models':'qwen2.5:3b'}).encode()
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(('0.0.0.0', 11434), H).serve_forever()
          "
          sleep 3
          curl -sf http://localhost:11434/api/tags | grep -q "models"
          docker rm -f test-llm
          echo "LLM smoke test passed"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          docker push helion444/llm:$VERSION

      - name: Update Helm image tag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=v${{ github.run_number }}
          sed -i "s|^\(  tag:\).*|\1 $VERSION|" helm/llm/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/llm/values.yaml
          git commit -m "ci: update llm image to $VERSION [skip ci]"
          git pull --rebase origin master
          git push