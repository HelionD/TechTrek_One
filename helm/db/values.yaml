image:
  repository: helion444/db
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
namespace: ""

service:
  type: ClusterIP
  port: 5432

# Database credentials (used by secrets.yaml)
postgresUser: techtrek
postgresPassword: secret
postgresDb: techtrek

# External service URLs (used by configmap.yaml)
redisUrl: "redis://redis-service:6379"
ollamaBaseUrl: "http://llm-service:11434"

# Persistence storage size
persistence:
  size: 1Gi

# Other values (keep as is)
autoscaling:
  enabled: false

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumeMounts: []
volumes: []

serviceAccount:
  create: false
  name: ""