
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-deployment
  namespace: techtrek
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
        - name: llm
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
 