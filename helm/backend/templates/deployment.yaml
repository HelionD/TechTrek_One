apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: techtrek
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-python
          image: {{.Values.image}} 
          ports:
            - containerPort: {{.Values.service.port}}
          env:
            - name: REDIS_URL
              value: {{.Values.redisUrl}}